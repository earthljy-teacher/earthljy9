<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>산과 염기 가상 실험실 미션</title>
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
:root{--bg:#eef6ff;--card:#fff;--ink:#2b3a55;--pink:#e0457b;--blue:#2f6fe4;--green:#1f9d6b;--red:#d9381e;--line:#cfe0f5;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#eef6ff}}
*{box-sizing:border-box;font-weight:normal!important}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'a시네마L','a시네마','Jua',sans-serif;font-size:17px;line-height:1.6}
body{padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
.wrap{max-width:860px;margin:0 auto;padding:12px}
header{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;padding:10px 4px}
header h1{font-size:23px;margin:0;color:var(--blue)}header p{margin:2px 0 0;font-size:14px}
.brand{text-align:right;font-size:12px;flex:none}.brand img{width:62px;height:62px;border-radius:12px;display:block;margin-left:auto}
.bar{display:flex;gap:6px;margin:6px 0 12px}.bar div{flex:1;text-align:center;font-size:13px;padding:5px 2px;border-radius:10px;background:#dbe6f5;color:#7a8aa5}
.bar .on{background:var(--blue);color:#fff}.bar .done{background:var(--green);color:#fff}
.card{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:16px;margin-bottom:14px;box-shadow:0 4px 0 #d4e3f7}
h2{font-size:21px;margin:0 0 6px;color:var(--pink)}
.em{color:var(--pink)}.bl{color:var(--blue)}.gr{color:var(--green)}.rd{color:var(--red)}
.mission{background:#fff7e0;border:2px dashed #f0b429;border-radius:14px;padding:10px 12px;margin:8px 0}
button,select,input,textarea{font-family:inherit;font-size:16px;color:var(--ink)}
.btn{background:var(--blue);color:#fff;border:0;border-radius:14px;padding:10px 18px;box-shadow:0 4px 0 #1b4aa6;cursor:pointer;margin:4px 4px 4px 0}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #1b4aa6}.btn.g{background:var(--green);box-shadow:0 4px 0 #136e49}.btn.o{background:#8a97ad;box-shadow:0 4px 0 #5f6b80}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.opt{display:block;width:100%;text-align:left;background:#f5f9ff;border:2px solid var(--line);border-radius:12px;padding:9px 12px;margin:6px 0;cursor:pointer}
.opt.ok{background:#dcf7e8;border-color:var(--green)}.opt.no{background:#ffe3df;border-color:var(--red)}
.fb{border-radius:12px;padding:9px 12px;margin:8px 0;font-size:15px}.fb.no{background:#fff0ee;color:#a52a14}.fb.ok{background:#e4f8ee;color:#136e49}
input[type=text],textarea,select{border:2px solid var(--line);border-radius:10px;padding:8px;background:#fff}textarea{width:100%;min-height:110px}
.chart{display:flex;gap:2px;margin:8px 0}.chart div{flex:1;height:44px;border-radius:6px;font-size:12px;text-align:center;padding-top:24px;color:#fff;text-shadow:0 0 3px #000}
.reg{display:flex;gap:2px;margin:-4px 0 8px}.reg div{text-align:center;font-size:13px;padding:4px 2px;border-radius:6px}
.papers{display:flex;gap:8px;flex-wrap:wrap}.papers div{flex:1;min-width:70px;height:56px;border-radius:10px;text-align:center;padding-top:14px;color:#fff;text-shadow:0 0 3px #000}
.shelf{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.sample,.tool{border:3px solid var(--line);background:#fff;border-radius:14px;padding:8px 12px;cursor:pointer;text-align:center;min-width:92px}
.sample.sel,.tool.sel{border-color:var(--pink);background:#fff0f6;transform:scale(1.05)}.sample.used{opacity:.35}
.plate{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;background:#9fb3cf;padding:12px;border-radius:18px;margin:10px 0}
.well{background:#e8eef7;border-radius:14px;padding:8px 4px;text-align:center;font-size:13px;cursor:pointer;min-height:150px;border:3px solid transparent}
.well.hot{border-color:var(--pink)}
.pool{width:62px;height:62px;border-radius:50%;margin:6px auto;background:#fff;border:4px solid #cbd6e6;transition:background 1s}
.strip{width:22px;height:46px;margin:4px auto;border-radius:4px;background:transparent;border:1px dashed #b7c4d8;transition:background 1s}
.log{font-size:12px;min-height:18px}
table{border-collapse:collapse;width:100%;font-size:14px}td,th{border:1px solid var(--line);padding:5px;text-align:center}th{background:#eaf2ff;color:var(--blue)}
.hide{display:none}
#modal{position:fixed;inset:0;background:rgba(20,30,50,.75);display:none;z-index:50;overflow:auto;padding:14px}
#modal .box{background:#fff;border-radius:16px;max-width:560px;margin:0 auto;padding:12px;text-align:center}#modal img{width:100%;border-radius:8px;-webkit-touch-callout:default}
#report{background:#fff;padding:16px;border-radius:14px;border:2px solid var(--line)}
#report .rh{display:flex;justify-content:space-between;align-items:center}
.ans{background:#f5f9ff;border-radius:10px;padding:8px 10px;margin:6px 0;font-size:15px;white-space:pre-wrap}
</style></head><body>

function mc(box,qs,st,onPass,need){
 let h='';qs.forEach((q,i)=>{h+=`<div class="card"><p><span class="em">Q${i+1}.</span> ${q.q}</p>${q.extra||''}`+q.o.map((t,j)=>`<button class="opt" data-q="${i}" data-o="${j}">${'①②③④'[j]} ${t}</button>`).join('')+`<div id="${box}f${i}"></div></div>`});
 h+=`<button class="btn g" id="${box}go" disabled>다음 단계로 →</button><span id="${box}msg" class="em"></span>`;
 $('#'+box).innerHTML=h;const res={};
 document.querySelectorAll(`#${box} .opt`).forEach(b=>b.onclick=()=>{
  const i=+b.dataset.q,j=+b.dataset.o,q=qs[i];if(res[i])return;
  if(j==q.a){res[i]=1;b.classList.add('ok');sound(660);$(`#${box}f${i}`).innerHTML=`<div class="fb ok">정답! ${q.e}</div>`;}
  else{S.stat[st]++;b.classList.add('no');sound(220);$(`#${box}f${i}`).innerHTML=`<div class="fb no">${q.fb[j]||'다시 생각해 봐요.'} (다른 보기를 눌러 다시 도전!)</div>`;}
  const n=Object.keys(res).length;
  if(n>=1&&Object.keys(res).length+Object.values(S.stat).length>=0){}
  const ok=Object.keys(res).length;S[st=='q1'?'q1ok':'q4ok']=ok;
  $(`#${box}msg`).textContent=` 정답 ${ok}/${qs.length} (통과 기준 ${need}문제)`;
  if(ok>=need)$(`#${box}go`).disabled=false;
 });

}

<button class="btn" id="st">미션 시작!</button></div>`;

/* 1 사전 퀴즈 */
function s1(){
 const paper=(c,l,p)=>`<div style="background:${c}">${l}</div>`;

 const qs=[
 {q:'산성 수용액의 특징으로 옳지 <span class="rd">않은</span> 것은?',o:['신맛이 난다.','푸른색 리트머스 종이를 붉게 변화시킨다.','마그네슘과 반응하여 수소 기체를 발생시킨다.','단백질을 녹여 만지면 미끈거린다.'],a:3,e:'미끈거리는 성질은 염기성의 특징이에요.',fb:{0:'신맛은 산성의 특징이에요.',1:'산성은 푸른 리트머스를 붉게 해요.',2:'산은 금속과 반응해 수소 기체를 내요.'}},
 {q:'BTB 용액을 떨어뜨렸을 때 산성 – 중성 – 염기성의 색을 순서대로 나열한 것은?',o:['노란색 – 초록색 – 파란색','파란색 – 초록색 – 노란색','붉은색 – 무색 – 붉은색','초록색 – 노란색 – 파란색'],a:0,e:'BTB는 산성 노랑, 중성 초록, 염기성 파랑이에요.',fb:{1:'순서가 반대예요. 산성은 노란색!',2:'붉은색·무색은 페놀프탈레인과 헷갈렸어요.',3:'중성이 초록색이에요. 산성은 노란색!'}},
 {q:'[이미지 문제] 색상표를 보고 A~D의 액성을 바르게 판별한 것은?',extra:ex,o:['A 산성, B 중성, C 염기성, D 산성','A 산성, B 염기성, C 산성, D 염기성','A 염기성, B 중성, C 산성, D 산성','A 산성, B 중성, C 산성, D 염기성'],a:0,e:'붉은~노란 계열은 pH 7 미만(산성), pH 7 부근은 중성, 푸른~보라 계열은 pH 7 초과(염기성)예요.',fb:{1:'B는 pH 7이라 중성이에요. C는 보라색 계열 pH 12이므로 염기성!',2:'A는 pH 2의 붉은 계열이라 산성이에요.',3:'C는 pH 12로 염기성, D는 pH 5로 산성이에요.'}}];
 $('#app').innerHTML=`<div class="card"><h2>📘 미션 1. 사전 지식 점검</h2><div class="mission">3문제 중 <span class="em">2문제 이상</span> 맞히면 홈판 실험실이 열려요!</div></div><div id="q1"></div>`;

/* 2 홈판 준비 */
function s2(){
 const L=['A','B','C','D'];let sel=null;const put={};
 $('#app').innerHTML=`<div class="card"><h2>🧫 미션 2. 홈판에 시료 넣기</h2><div class="mission">미지의 용액 병을 눌러 고른 뒤, <span class="em">이름표(A~D)가 같은 홈</span>을 눌러 넣으세요. 용액 A는 홈 A, 용액 B는 홈 B처럼 짝을 맞춰요.</div>

 const order=[2,0,3,1];
 $('#sh').innerHTML=order.map(i=>`<div class="sample" data-i="${i}"><div style="font-size:26px">🧴</div>${SAMPLES[i].n}</div>`).join('');
 const draw=()=>{$('#pl').innerHTML=L.map((l,k)=>`<div class="well" data-k="${k}">홈 ${l}<div class="pool" style="background:${put[k]!=null?SAMPLES[put[k]].c:'#fff'}"></div><div>${put[k]!=null?SAMPLES[put[k]].n:'비어 있음'}</div></div>`).join('');
  document.querySelectorAll('.well').forEach(w=>w.onclick=()=>{const k=+w.dataset.k;if(sel==null){$('#m2').innerHTML='<div class="fb no">먼저 위에서 시료를 골라요.</div>';return}
   if(put[k]!=null)return;
   if(sel==k){put[k]=sel;document.querySelector(`.sample[data-i="${sel}"]`).classList.add('used');document.querySelector(`.sample[data-i="${sel}"]`).classList.remove('sel');sel=null;sound(660);$('#m2').innerHTML='<div class="fb ok">알맞게 넣었어요!</div>';draw();if(Object.keys(put).length==4){$('#n2').disabled=false;$('#m2').innerHTML='<div class="fb ok">모든 시료 배치 완료! 미션 성공 🎉</div>'}}
   else{S.stat.place++;sound(220);$('#m2').innerHTML=`<div class="fb no">홈 ${L[k]}에는 이름표가 ${L[k]}인 용액을 넣어야 해요. ${SAMPLES[sel].n}은(는) 홈 ${L[sel]}에 넣어요.</div>`}})};
 draw();
 document.querySelectorAll('.sample').forEach(s=>s.onclick=()=>{if(s.classList.contains('used'))return;document.querySelectorAll('.sample').forEach(x=>x.classList.remove('sel'));s.classList.add('sel');sel=+s.dataset.i});

/* 3 탐구 실험 */
function s3(){
 const L=['A','B','C','D'];let tool=null;const dph={},dbtb={};
 $('#app').innerHTML=`<div class="card"><h2>🔬 미션 3. pH 롤미터와 BTB 용액 탐구</h2>
 <div class="mission">① <span class="bl">pH 롤미터</span> 도구를 고르고 4개 홈을 모두 눌러요. → ② <span class="bl">BTB 용액</span> 도구가 열리면 4개 홈에 떨어뜨려요. → ③ 결과표를 작성해요.</div>
 <div class="shelf"><div class="tool" id="t1" data-t="1"><div style="font-size:26px">🎞️</div>pH 롤미터</div><div class="tool" id="t2" data-t="2" style="opacity:.4"><div style="font-size:26px">💧</div>BTB 용액 (잠김)</div></div>
 <p class="bl" style="margin:0">표준 색상표 (비교해 보세요)</p>${chart()}
 <div class="plate" id="pl3"></div><div id="m3"></div>
 <div id="tb" class="hide"><p class="em">결과표: 색을 보고 pH 값과 액성을 골라 보세요.</p><table><tr><th>홈</th><th>시료</th><th>pH 시험지 색</th><th>BTB 색</th><th>추정 pH</th><th>액성</th></tr><tbody id="rows"></tbody></table><button class="btn g" id="chk">결과 확인</button><div id="m3b"></div></div>
 <button class="btn g" id="n3" disabled>정리 퀴즈로 →</button></div>`;
 const draw=()=>{$('#pl3').innerHTML=L.map((l,k)=>`<div class="well hot" data-k="${k}">홈 ${l}<div class="pool" style="background:${dbtb[k]||SAMPLES[k].c}"></div><div>${SAMPLES[k].n}</div><div class="strip" style="background:${dph[k]?PH[SAMPLES[k].ph-1]:'transparent'}"></div><div class="log">${dph[k]?'pH 시험지 ✔':''} ${dbtb[k]?'BTB ✔':''}</div></div>`).join('');
  document.querySelectorAll('#pl3 .well').forEach(w=>w.onclick=()=>{const k=+w.dataset.k;if(!tool){$('#m3').innerHTML='<div class="fb no">먼저 도구를 골라요.</div>';return}
   if(tool==1&&!dph[k]){dph[k]=1;sound(520)}else if(tool==2&&!dbtb[k]){dbtb[k]=SAMPLES[k].btb;sound(560)}draw();
   if(Object.keys(dph).length==4&&!S.t2){S.t2=1;$('#t2').style.opacity=1;$('#t2').innerHTML='<div style="font-size:26px">💧</div>BTB 용액';$('#m3').innerHTML='<div class="fb ok">pH 시험지 관찰 완료! BTB 용액이 열렸어요.</div>'}
   if(Object.keys(dbtb).length==4){$('#tb').classList.remove('hide');$('#m3').innerHTML='<div class="fb ok">모든 관찰 완료! 결과표를 작성해요.</div>'}})};
 draw();S.t2=0;
 const pick=t=>{if(t==2&&!S.t2)return;tool=t;document.querySelectorAll('.tool').forEach(x=>x.classList.remove('sel'));$('#t'+t).classList.add('sel')};
 $('#t1').onclick=()=>pick(1);$('#t2').onclick=()=>pick(2);
 const opts=Array.from({length:14},(_,i)=>`<option value="${i+1}">pH ${i+1}</option>`).join('');
 $('#rows').innerHTML=L.map((l,k)=>`<tr><td>${l}</td><td>${SAMPLES[k].n}</td><td><span style="display:inline-block;width:26px;height:18px;border-radius:4px;background:${PH[SAMPLES[k].ph-1]}"></span></td><td><span style="display:inline-block;width:26px;height:18px;border-radius:4px;background:${SAMPLES[k].btb}"></span></td><td><select id="p${k}"><option value="">선택</option>${opts}</select></td><td><select id="c${k}"><option value="">선택</option><option>산성</option><option>중성</option><option>염기성</option></select></td></tr>`).join('');
 $('#chk').onclick=()=>{let bad=[],ans=[];L.forEach((l,k)=>{const p=+$('#p'+k).value,c=$('#c'+k).value;if(!p||!c){bad.push(`홈 ${l}: 아직 다 고르지 않았어요.`);return}
   if(Math.abs(p-SAMPLES[k].ph)>1)bad.push(`${SAMPLES[k].n}: 시험지 색을 표준 색상표에서 다시 찾아봐요.`);
   else if(c!=SAMPLES[k].k)bad.push(`${SAMPLES[k].n}: pH 7보다 작으면 산성, 크면 염기성이에요. BTB 색(노랑=산성, 파랑=염기성)도 확인!`);
   ans.push(`${SAMPLES[k].n}: pH ${p}, ${c}`)});
  if(bad.length){S.stat.cls++;sound(220);$('#m3b').innerHTML='<div class="fb no">'+bad.join('<br>')+'</div>'}
  else{S.cls=ans;sound(660);$('#m3b').innerHTML='<div class="fb ok">모두 정답! 미지의 용액 A·B는 <span class="rd">산성</span>(BTB 노란색), C·D는 <span class="bl">염기성</span>(BTB 파란색)이에요. 미션 성공 🎉</div>';$('#n3').disabled=false}};
 $('#n3').onclick=()=>{S.done[2]=true;go(4)}}
/* 4 정리 퀴즈 + 서술형 */
function s4(){
 const qs=[
 {q:'BTB 용액을 떨어뜨렸더니 파란색이 되었다. 이 용액의 액성은?',o:['산성','중성','염기성','알 수 없다'],a:2,e:'BTB가 파란색이면 염기성이에요.',fb:{0:'산성은 노란색이에요.',1:'중성은 초록색이에요.',3:'BTB 색으로 액성을 알 수 있어요.'}},
 {q:'pH 시험지가 pH 3에 해당하는 주황색으로 변한 용액에 대한 설명으로 옳은 것은?',o:['염기성이며 BTB 용액을 파랗게 한다.','산성이며 BTB 용액을 노랗게 한다.','중성이며 BTB 용액을 초록으로 한다.','pH가 7보다 커서 미끈거린다.'],a:1,e:'pH 3은 7보다 작으므로 산성이고 BTB는 노란색이에요.',fb:{0:'pH 3은 염기성이 아니에요.',2:'중성은 pH 7이에요.',3:'pH 7보다 작아요.'}},
 {q:'이번 실험에서 염기성인 미지의 용액끼리 짝지은 것은?',o:['미지의 용액 A, B','미지의 용액 B, C','미지의 용액 C, D','미지의 용액 A, D'],a:2,e:'C와 D가 염기성(pH 시험지 푸른·보라 계열, BTB 파란색)이에요.',fb:{0:'A와 B는 pH 7보다 작은 산성이에요.',1:'B는 pH 1로 산성이에요.',3:'A는 pH 2로 산성이에요.'}}];
 $('#app').innerHTML=`<div class="card"><h2>📝 미션 4. 정리 퀴즈와 서술형</h2><div class="mission">객관식 <span class="em">3문제 중 2문제 이상</span> + 서술형을 제출하면 미션이 완료돼요.</div></div><div id="q4"></div>
 <div class="card hide" id="wr"><p><span class="em">서술형.</span> pH 롤미터와 BTB 용액으로 산성과 염기성 물질을 구분하는 방법을 이번 실험의 미지의 용액 A~D 결과를 예로 들어 서술하시오.</p>
 <textarea id="wt" placeholder="pH 시험지 색과 BTB 용액 색의 변화를 모두 써 보세요."></textarea><button class="btn" id="ws">제출하기</button><div id="wf"></div><button class="btn g hide" id="fin">미션 성공 확인하기 →</button></div>`;
 mc('q4',qs,'q4',()=>{$('#wr').classList.remove('hide');$('#wr').scrollIntoView({behavior:'smooth'})},2);
 $('#q4go').textContent='서술형 문제 열기 ↓';
 $('#ws').onclick=()=>{const t=$('#wt').value.trim();const g=[
  [/롤미터|시험지|ph/i,'pH 롤미터(시험지)의 색을 표준 색상표와 비교한다는 내용'],
  [/(붉|빨강|주황|노란|노랑)/,'산성은 붉은~노란 계열이며 pH 7보다 작다는 내용'],
  [/(푸른|파란|파랑|보라)/,'염기성은 푸른~보라 계열이며 pH 7보다 크다는 내용'],
  [/(노란|노랑)[\s\S]*(파란|파랑)|(파란|파랑)[\s\S]*(노란|노랑)/,'BTB 용액은 산성 노란색, 염기성 파란색이라는 내용'],
  [/(^|[^A-Za-z])[A-Da-d]([^A-Za-z]|$)/,'미지의 용액 A~D를 예로 드는 내용']];
  const miss=g.filter(x=>!x[0].test(t)).map(x=>x[1]);const sc=5-miss.length;S.stat.wr++;
  if(t.length<15||sc<3){sound(220);$('#wf').innerHTML=`<div class="fb no">조금 더 구체적으로 써 볼까요? 빠진 내용:<br>${miss.map(m=>'· '+m).join('<br>')}</div>`;return}
  S.written=t;S.score=sc;sound(660);$('#wf').innerHTML=`<div class="fb ok">포함한 핵심 ${sc}/5개. ${miss.length?'<br>더 보완하면 좋은 점:<br>'+miss.map(m=>'· '+m).join('<br>'):'핵심을 모두 담았어요!'}<br><span class="bl">예시 답안:</span> pH 시험지가 붉은~노란색이면 pH 7보다 작은 산성이고 BTB 용액은 노란색이 된다. 푸른~보라색이면 pH 7보다 큰 염기성이고 BTB 용액은 파란색이 된다. 미지의 용액 A와 B는 산성, C와 D는 염기성이다.</div>`;$('#fin').classList.remove('hide')};
 $('#fin').onclick=()=>{S.done[3]=true;go(5)}}

function fbText(){const s=S.stat,p=[];
 p.push(`${S.name} 학생은 사전 퀴즈, 홈판 준비, 탐구 실험, 정리 퀴즈와 서술형까지 모든 미션을 완료했습니다.`);

 p.push(`pH 롤미터의 색(붉은 계열 → 산성, 푸른·보라 계열 → 염기성)과 BTB 용액의 색(노란색 → 산성, 파란색 → 염기성)을 함께 비교해 액성을 판단했습니다.`);
 p.push(`서술형에서 핵심 ${S.score}/5개를 포함했습니다. ${S.score==5?'근거와 예시가 모두 잘 들어 있습니다.':'pH 7 기준과 두 지시약의 색 변화를 용액 A~D를 예로 들어 쓰면 더 완성도가 높아집니다.'}`);
